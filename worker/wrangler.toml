name = "tangerene-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Self-hosted vision model (e.g. Qwen2.5-VL on GCP) behind an OpenAI-compatible
# /v1/chat/completions endpoint. The Worker adapts the app's Anthropic-format
# requests to this endpoint. If the endpoint needs auth, set a bearer token as a
# secret instead of putting it here:  npx wrangler secret put LLM_API_KEY
[vars]
LLM_ENDPOINT = "https://YOUR-GCP-ENDPOINT/v1/chat/completions"
LLM_MODEL = "Qwen/Qwen2.5-VL-7B-Instruct"
